<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>链球 - Chain Ball</title>
  <style>
    :root {
      --cyan: #00e5ff;
      --blue: #2979ff;
      --purple: #7c4dff;
      --dark: #06060e;
      --node-size: clamp(28px, 3vw, 40px);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--dark);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── 背景粒子动画 ── */
    .bg-particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* ── 主场景容器 ── */
    .scene-wrapper {
      position: relative;
      /* 正方形 = min(80vh, 80vw 但保持正方形) */
      width: min(80vh, 80vw);
      height: min(80vh, 80vw);
      z-index: 1;
      cursor: grab;
    }
    .scene-wrapper:active {
      cursor: grabbing;
    }
    .scene-wrapper.grabbing {
      cursor: grabbing;
    }

    canvas#three-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ── 标签覆盖层 ── */
    .labels-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }
    .labels-layer a {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      text-decoration: none !important;
      color: #e0f7fa;
      font-size: var(--node-size);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-shadow:
        0 0 8px var(--cyan),
        0 0 20px var(--blue),
        0 0 40px var(--cyan);
      transition: color 0.25s, text-shadow 0.25s, transform 0.15s;
      white-space: nowrap;
      line-height: 1;
      /* 去掉下划线的关键 */
      border-bottom: none;
      outline: none;
    }
    .labels-layer a:hover {
      color: #fff;
      text-shadow:
        0 0 12px #fff,
        0 0 30px var(--cyan),
        0 0 60px var(--blue),
        0 0 90px var(--purple);
      transform: translate(-50%, -50%) scale(1.18);
    }
    .labels-layer a:visited {
      color: #e0f7fa;
    }
    .labels-layer a:active {
      transform: translate(-50%, -50%) scale(0.95);
    }
    /* 背面隐藏 */
    .labels-layer a.hidden-label {
      opacity: 0;
      pointer-events: none;
    }

    /* ── 标题 ── */
    .title-bar {
      position: fixed;
      top: clamp(6px, 1.5vh, 20px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
    }
    .title-bar h1 {
      font-size: clamp(14px, 2.2vw, 22px);
      font-weight: 300;
      letter-spacing: 0.35em;
      color: rgba(180, 220, 255, 0.6);
      text-transform: uppercase;
    }

    /* ── 底部提示 ── */
    .hint {
      position: fixed;
      bottom: clamp(10px, 2.5vh, 28px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
      font-size: 12px;
      letter-spacing: 0.15em;
      color: rgba(180, 210, 240, 0.45);
    }
  </style>
</head>
<body>

  <!-- 背景粒子 canvas -->
  <canvas class="bg-particles" id="bg-canvas"></canvas>

  <!-- 标题 -->
  <div class="title-bar"><h1>⚙&ensp;Chain Ball&ensp;⚙</h1></div>

  <!-- 提示 -->
  <div class="hint">🖱 拖拽旋转 &ensp;|&ensp; 点击节点跳转</div>

  <!-- 主场景 -->
  <div class="scene-wrapper" id="scene-wrapper">
    <canvas id="three-canvas"></canvas>
    <div class="labels-layer" id="labels-layer">
      <a href="pages/web.html"    data-node="0">Web</a>
      <a href="pages/re.html"     data-node="1">Re</a>
      <a href="pages/dev.html"    data-node="2">Dev</a>
      <a href="pages/sa.html"     data-node="3">SA</a>
      <a href="pages/misc.html"   data-node="4">Misc</a>
      <a href="pages/crypto.html" data-node="5">Crypto</a>
      <a href="pages/design.html" data-node="6">Design</a>
      <a href="pages/pwn.html"    data-node="7">Pwn</a>
    </div>
  </div>

  <!-- Three.js import map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ═══════════════════════════════════
    //  DOM refs
    // ═══════════════════════════════════
    const wrapper      = document.getElementById('scene-wrapper');
    const threeCanvas  = document.getElementById('three-canvas');
    const labelsLayer  = document.getElementById('labels-layer');
    const labelAnchors = [...labelsLayer.querySelectorAll('a')];
    const bgCanvas     = document.getElementById('bg-canvas');

    // ═══════════════════════════════════
    //  常量
    // ═══════════════════════════════════
    const NODE_NAMES = ['Web','Re','Dev','SA','Misc','Crypto','Design','Pwn'];
    const SPHERE_R   = 3.2;          // 节点所在球的半径 (3D 单位)
    const NODE_R     = 0.14;         // 小球半径
    const GLOW_SCALE = 0.55;         // 光晕 sprite 大小

    // 8 个节点均匀分布在球面上 — 使用立方体顶点归一化投影
    function cubeVertexPositions(radius) {
      const raw = [];
      for (let x = -1; x <= 1; x += 2)
        for (let y = -1; y <= 1; y += 2)
          for (let z = -1; z <= 1; z += 2)
            raw.push(new THREE.Vector3(x, y, z).normalize().multiplyScalar(radius));
      return raw;
    }
    const NODE_POSITIONS = cubeVertexPositions(SPHERE_R);

    // ═══════════════════════════════════
    //  Three.js 初始化
    // ═══════════════════════════════════
    const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(42, 1, 0.5, 30);
    camera.position.set(0, 0, 9.5);
    camera.lookAt(0, 0, 0);

    // ── 可旋转的组 ──
    const pivot = new THREE.Group();
    scene.add(pivot);

    // ── 光照 ──
    scene.add(new THREE.AmbientLight(0x1a1a3a, 2.5));
    const dirLight = new THREE.DirectionalLight(0x88ccff, 4);
    dirLight.position.set(5, 8, 5);
    scene.add(dirLight);
    const pointLight = new THREE.PointLight(0x00c8ff, 30, 18);
    pointLight.position.set(0, 0, 0);
    scene.add(pointLight);

    // ═══════════════════════════════════
    //  外框线球
    // ═══════════════════════════════════
    const outerGeo = new THREE.IcosahedronGeometry(SPHERE_R + 0.6, 3);
    const outerWire = new THREE.LineSegments(
      new THREE.WireframeGeometry(outerGeo),
      new THREE.LineBasicMaterial({ color: 0x1a3355, transparent: true, opacity: 0.35 })
    );
    pivot.add(outerWire);

    // 第二层线框（稍大、更淡）
    const outerWire2 = new THREE.LineSegments(
      new THREE.WireframeGeometry(new THREE.IcosahedronGeometry(SPHERE_R + 0.9, 2)),
      new THREE.LineBasicMaterial({ color: 0x0d2244, transparent: true, opacity: 0.2 })
    );
    pivot.add(outerWire2);

    // 赤道光环
    const ringGeo = new THREE.TorusGeometry(SPHERE_R + 0.45, 0.015, 16, 120);
    const ringMat = new THREE.MeshStandardMaterial({
      color: 0x00c8ff,
      emissive: 0x004466,
      emissiveIntensity: 2,
      roughness: 0.3,
      metalness: 0.9,
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    pivot.add(ring);

    const ring2 = new THREE.Mesh(
      new THREE.TorusGeometry(SPHERE_R + 0.45, 0.01, 16, 120),
      new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.5 })
    );
    ring2.rotation.x = Math.PI / 2.8;
    ring2.rotation.y = Math.PI / 3.5;
    pivot.add(ring2);

    // ═══════════════════════════════════
    //  节点连线（全连接图）
    // ═══════════════════════════════════
    const linesGroup = new THREE.Group();
    pivot.add(linesGroup);

    const lineMaterial = new THREE.LineBasicMaterial({
      color: 0x1a5577,
      transparent: true,
      opacity: 0.45,
      linewidth: 1,
    });

    for (let i = 0; i < NODE_POSITIONS.length; i++) {
      for (let j = i + 1; j < NODE_POSITIONS.length; j++) {
        const geo = new THREE.BufferGeometry().setFromPoints([
          NODE_POSITIONS[i], NODE_POSITIONS[j]
        ]);
        linesGroup.add(new THREE.Line(geo, lineMaterial));
      }
    }

    // 第二组更亮的线
    const lineMaterial2 = new THREE.LineBasicMaterial({
      color: 0x0088cc,
      transparent: true,
      opacity: 0.18,
      linewidth: 1,
    });
    for (let i = 0; i < NODE_POSITIONS.length; i++) {
      for (let j = i + 1; j < NODE_POSITIONS.length; j++) {
        // 只画一部分避免太密
        if ((i + j) % 3 !== 0) continue;
        const geo = new THREE.BufferGeometry().setFromPoints([
          NODE_POSITIONS[i], NODE_POSITIONS[j]
        ]);
        linesGroup.add(new THREE.Line(geo, lineMaterial2));
      }
    }

    // ═══════════════════════════════════
    //  节点小球 + 光晕
    // ═══════════════════════════════════
    const nodesGroup = new THREE.Group();
    pivot.add(nodesGroup);

    // 光晕纹理 (canvas)
    function createGlowTexture(innerColor, outerColor) {
      const size = 128;
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
      g.addColorStop(0, innerColor);
      g.addColorStop(0.12, innerColor);
      g.addColorStop(0.4, outerColor);
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);
      return new THREE.CanvasTexture(c);
    }

    const glowTex = createGlowTexture('rgba(0,230,255,1)', 'rgba(0,80,200,0)');

    const nodeMeshes = [];   // 存小球 mesh
    const glowSprites = [];  // 存光晕 sprite

    NODE_POSITIONS.forEach((pos) => {
      // 小球
      const sphereGeo = new THREE.SphereGeometry(NODE_R, 32, 32);
      const sphereMat = new THREE.MeshStandardMaterial({
        color: 0x00e5ff,
        emissive: 0x004488,
        emissiveIntensity: 2.5,
        roughness: 0.2,
        metalness: 0.7,
      });
      const sphere = new THREE.Mesh(sphereGeo, sphereMat);
      sphere.position.copy(pos);
      nodesGroup.add(sphere);
      nodeMeshes.push(sphere);

      // 光晕
      const spriteMat = new THREE.SpriteMaterial({
        map: glowTex,
        blending: THREE.AdditiveBlending,
        transparent: true,
        opacity: 0.7,
        depthWrite: false,
      });
      const sprite = new THREE.Sprite(spriteMat);
      sprite.position.copy(pos);
      sprite.scale.set(GLOW_SCALE, GLOW_SCALE, 1);
      nodesGroup.add(sprite);
      glowSprites.push(sprite);
    });

    // ═══════════════════════════════════
    //  粒子环 (每个节点周围)
    // ═══════════════════════════════════
    const particlesGroup = new THREE.Group();
    pivot.add(particlesGroup);

    NODE_POSITIONS.forEach((pos) => {
      const count = 18;
      const pGeo = new THREE.BufferGeometry();
      const pPositions = new Float32Array(count * 3);
      for (let k = 0; k < count; k++) {
        const angle = (k / count) * Math.PI * 2;
        const r = 0.32;
        pPositions[k * 3]     = pos.x + Math.cos(angle) * r;
        pPositions[k * 3 + 1] = pos.y + Math.sin(angle) * r;
        pPositions[k * 3 + 2] = pos.z;
      }
      pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
      const pMat = new THREE.PointsMaterial({
        color: 0x44ccff,
        size: 0.025,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        transparent: true,
        opacity: 0.7,
      });
      particlesGroup.add(new THREE.Points(pGeo, pMat));
    });

    // ═══════════════════════════════════
    //  散落粒子
    // ═══════════════════════════════════
    const scatterCount = 200;
    const scatterGeo = new THREE.BufferGeometry();
    const scatterPositions = new Float32Array(scatterCount * 3);
    for (let i = 0; i < scatterCount; i++) {
      // 球壳附近
      const theta = Math.random() * Math.PI * 2;
      const phi   = Math.acos(2 * Math.random() - 1);
      const r     = SPHERE_R + 0.6 + Math.random() * 0.9;
      scatterPositions[i*3]     = Math.sin(phi) * Math.cos(theta) * r;
      scatterPositions[i*3 + 1] = Math.sin(phi) * Math.sin(theta) * r;
      scatterPositions[i*3 + 2] = Math.cos(phi) * r;
    }
    scatterGeo.setAttribute('position', new THREE.BufferAttribute(scatterPositions, 3));
    const scatterMat = new THREE.PointsMaterial({
      color: 0x3388cc,
      size: 0.03,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      transparent: true,
      opacity: 0.5,
    });
    const scatterPoints = new THREE.Points(scatterGeo, scatterMat);
    pivot.add(scatterPoints);

    // ═══════════════════════════════════
    //  轨道控制器 - 自定义 Trackball
    // ═══════════════════════════════════
    const trackball = {
      quat: new THREE.Quaternion(),
      prevQuat: new THREE.Quaternion(),
      dragging: false,
      prevMouse: new THREE.Vector2(),
      velocity: new THREE.Vector2(),   // 惯性速度
      damping: 0.94,
    };

    function getCanvasPos(e) {
      const rect = threeCanvas.getBoundingClientRect();
      return {
        x: ((e.clientX - rect.left) / rect.width)  * 2 - 1,
        y: -((e.clientY - rect.top) / rect.height) * 2 + 1,
      };
    }

    // 鼠标 → 虚拟轨迹球上的 3D 点
    function screenToTrackball(sx, sy) {
      const d2 = sx * sx + sy * sy;
      const r2 = 1.0;  // 轨迹球半径（NDC）
      const z = d2 <= r2 * 0.5
        ? Math.sqrt(r2 - d2)
        : r2 * 0.5 / Math.sqrt(d2);
      return new THREE.Vector3(sx, sy, z).normalize();
    }

    function onPointerDown(e) {
      e.preventDefault();
      trackball.dragging = true;
      trackball.prevQuat.copy(trackball.quat);
      const { x, y } = getCanvasPos(e);
      trackball.prevMouse.set(x, y);
      trackball.velocity.set(0, 0);
      wrapper.classList.add('grabbing');
    }

    function onPointerMove(e) {
      const { x, y } = getCanvasPos(e);
      if (trackball.dragging) {
        const p0 = screenToTrackball(trackball.prevMouse.x, trackball.prevMouse.y);
        const p1 = screenToTrackball(x, y);
        const axis = new THREE.Vector3().crossVectors(p0, p1).normalize();
        const angle = Math.acos(Math.min(1, p0.dot(p1)));
        if (axis.length() > 0.001 && !isNaN(angle)) {
          const deltaQ = new THREE.Quaternion().setFromAxisAngle(axis, angle * 1.8);
          trackball.quat.copy(trackball.prevQuat).premultiply(deltaQ);
          trackball.quat.normalize();
          pivot.quaternion.copy(trackball.quat);
        }
        // 记录速度
        trackball.velocity.set(
          x - trackball.prevMouse.x,
          y - trackball.prevMouse.y
        );
        trackball.prevMouse.set(x, y);
        trackball.prevQuat.copy(trackball.quat);
      }
    }

    function onPointerUp() {
      trackball.dragging = false;
      wrapper.classList.remove('grabbing');
    }

    // 事件绑定
    threeCanvas.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointerleave', onPointerUp);

    // 触摸事件（防止页面滚动）
    threeCanvas.addEventListener('touchstart', (e) => {
      if (e.target === threeCanvas) e.preventDefault();
    }, { passive: false });

    // ═══════════════════════════════════
    //  标签投影
    // ═══════════════════════════════════
    function updateLabels() {
      const halfW = threeCanvas.clientWidth / 2;
      const halfH = threeCanvas.clientHeight / 2;

      NODE_POSITIONS.forEach((localPos, i) => {
        const anchor = labelAnchors[i];
        if (!anchor) return;

        // 世界坐标
        const worldPos = localPos.clone().applyMatrix4(pivot.matrixWorld);
        // 转为相机坐标
        const camPos = worldPos.clone().applyMatrix4(camera.matrixWorldInverse);

        // 判断是否在相机前方
        if (camPos.z > 0) {
          anchor.classList.add('hidden-label');
          return;
        }

        anchor.classList.remove('hidden-label');

        // 投影到屏幕
        const projected = worldPos.clone().project(camera);
        const sx = (projected.x * 0.5 + 0.5) * threeCanvas.clientWidth;
        const sy = (-projected.y * 0.5 + 0.5) * threeCanvas.clientHeight;

        // 调整透明度（越靠近边缘越淡）
        const edgeDist = Math.min(
          Math.abs(projected.x),
          Math.abs(projected.y)
        );
        const alpha = THREE.MathUtils.clamp(edgeDist * 2.2, 0.4, 1);
        anchor.style.opacity = alpha;

        anchor.style.left = sx + 'px';
        anchor.style.top  = sy + 'px';
      });
    }

    // ═══════════════════════════════════
    //  动画循环
    // ═══════════════════════════════════
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.1);

      // 惯性旋转
      if (!trackball.dragging) {
        const speed = trackball.velocity.length();
        if (speed > 0.0003) {
          const axis = new THREE.Vector3(
            -trackball.velocity.y,
            -trackball.velocity.x,
            0
          ).normalize();
          const angle = speed * 2.5;
          if (axis.length() > 0.001) {
            const deltaQ = new THREE.Quaternion().setFromAxisAngle(axis, angle);
            trackball.quat.premultiply(deltaQ).normalize();
            pivot.quaternion.copy(trackball.quat);
          }
          trackball.velocity.multiplyScalar(trackball.damping);
        } else if (speed > 0) {
          trackball.velocity.set(0, 0);
        }
      }

      // 光环微动
      ring.rotation.z  += dt * 0.12;
      ring2.rotation.z -= dt * 0.08;
      ring2.rotation.x += dt * 0.06;

      // 散落粒子微动
      scatterPoints.rotation.y += dt * 0.04;
      scatterPoints.rotation.x += dt * 0.025;

      // 光晕脉动（随时间的微小的 scale 变化）
      const t = performance.now() * 0.001;
      glowSprites.forEach((s, i) => {
        const pulse = 1 + Math.sin(t * 2.5 + i * 0.9) * 0.08;
        s.scale.set(GLOW_SCALE * pulse, GLOW_SCALE * pulse, 1);
      });

      renderer.render(scene, camera);
      updateLabels();
    }

    // ═══════════════════════════════════
    //  响应式
    // ═══════════════════════════════════
    function resize() {
      const size = wrapper.clientWidth;  // 正方形
      renderer.setSize(size, size, false);
      camera.aspect = 1;
      camera.updateProjectionMatrix();
    }

    window.addEventListener('resize', resize);
    // 初始 resize
    resize();

    // ═══════════════════════════════════
    //  背景粒子 canvas
    // ═══════════════════════════════════
    function setupBgParticles() {
      const ctx = bgCanvas.getContext('2d');
      bgCanvas.width  = window.innerWidth;
      bgCanvas.height = window.innerHeight;

      const stars = Array.from({ length: 90 }, () => ({
        x: Math.random() * bgCanvas.width,
        y: Math.random() * bgCanvas.height,
        r: Math.random() * 1.4 + 0.3,
        alpha: Math.random() * 0.6 + 0.2,
        speed: Math.random() * 0.015 + 0.005,
      }));

      function drawBg() {
        ctx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
        stars.forEach(s => {
          s.alpha += s.speed;
          if (s.alpha > 0.9 || s.alpha < 0.15) s.speed *= -1;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(80,180,255,${s.alpha.toFixed(2)})`;
          ctx.fill();
        });
        requestAnimationFrame(drawBg);
      }
      drawBg();

      window.addEventListener('resize', () => {
        bgCanvas.width  = window.innerWidth;
        bgCanvas.height = window.innerHeight;
      });
    }
    setupBgParticles();

    // ═══════════════════════════════════
    //  启动
    // ═══════════════════════════════════
    // 初始姿态（微倾，更好看）
    trackball.quat.setFromEuler(new THREE.Euler(0.35, 0.25, 0.15));
    trackball.quat.normalize();
    pivot.quaternion.copy(trackball.quat);

    animate();

    console.log('%c🚀 链球 Chain Ball 已就绪 %c| %c8 节点 · 拖拽旋转 · 点击跳转',
      'color:#00e5ff;font-size:16px;',
      '',
      'color:#aaa;');
  </script>
</body>
</html>
