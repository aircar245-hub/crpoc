<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design - Chain Ball</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#06060e;color:#e0f7fa;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
    .card{text-align:center;padding:60px 50px;border:1px solid rgba(0,229,255,0.25);border-radius:20px;background:rgba(10,15,30,0.7);backdrop-filter:blur(12px);box-shadow:0 0 60px rgba(0,180,255,0.12);max-width:420px;width:90%}
    .card h1{font-size:3rem;font-weight:700;letter-spacing:.08em;text-shadow:0 0 12px #00e5ff,0 0 40px #2979ff;margin-bottom:12px}
    .card .sub{font-size:.95rem;color:rgba(180,210,240,0.5);letter-spacing:.15em;margin-bottom:36px}
    .card a{display:inline-block;padding:10px 32px;border:1px solid rgba(0,229,255,0.4);border-radius:30px;color:#00e5ff;text-decoration:none;font-size:.9rem;letter-spacing:.1em;transition:all .25s}
    .card a:hover{background:rgba(0,229,255,0.1);box-shadow:0 0 24px rgba(0,200,255,0.35);color:#fff}
  </style>
</head>
<body>
  <div class="card">
    <h1>Design</h1>
    <p class="sub">UI/UX &amp; Visual Design</p>

  </div>
